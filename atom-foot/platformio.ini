; atom-foot（yuuki-lab 内。由来: atoms3-on-foot）
; 足裏 DF9-40 四隅圧力: 脚側 ATOMS3 Lite (I2C マスター) ↔ 足側 ATOMS3 Lite (I2C スレーブ)
;
; 配線の骨格:
;   PC --USB-C-- [Master ATOMS3 Lite] --Grove-- [Grove Hub] --Grove-- [Slave ATOMS3 Lite on foot]
;
; 書き込み:
;   1. Python GUI / シリアルモニタを閉じる
;   2. リセットを約 2 秒押し、緑 LED が点いたら離す（ダウンロードモード）
;   3. 先にスレーブ、次にマスター
;        pio run -e i2c_slave  -t upload
;        pio run -e i2c_master -t upload
;   COM が複数あるときは --upload-port COMx を付ける
;
; GUI:
;   pip install -r tools/requirements.txt
;   python tools/foot_pressure_gui.py

[platformio]
default_envs = i2c_master
src_dir = src

; ---------------------------------------------------------------------------
; 両環境共通（ATOMS3 Lite = ESP32-S3FN8）
; ---------------------------------------------------------------------------
[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; USB CDC では 921600 切替後に No serial data になりやすい
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_reset, time
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED@^3.7.8

; ---------------------------------------------------------------------------
; I2C マスター: 脚の ATOMS3 Lite。PC と USB で話し、足側スレーブを読む
; ---------------------------------------------------------------------------
[env:i2c_master]
build_src_filter = +<master/>
build_flags =
    ${env.build_flags}
    -DI2C_ROLE_MASTER=1
    -Isrc/master

; ---------------------------------------------------------------------------
; I2C スレーブ: 足裏の ATOMS3 Lite。DF9-40 四隅を ADC で読み、I2C で公開する
; ---------------------------------------------------------------------------
[env:i2c_slave]
build_src_filter = +<slave/>
build_flags =
    ${env.build_flags}
    -DI2C_ROLE_SLAVE=1
    -Isrc/slave
