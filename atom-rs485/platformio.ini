; ATOM S3R + ATOMIC RS485 ベース（M5STACK-A131）で SM105BL を机上試験する。
; atom-rt / atom-foot の本線ではない。この環境を焼くと、その個体の can-leg は消える。
; 戻すときは atom-rt で pio run -e can-leg -t upload。
;
; 配線:
;   ベースの端子は A / B / GND だけ。12V 端子は空ける（USB が ATOM を給電する）。
;   サーボの 4=A、3=B、1=GND。サーボの 2 だけに 12V（9〜12.6V）。GND は電源と共通。
;   UART は公式例どおり受信 GPIO5、送信 GPIO6。CAN ベースとは向きが逆。
;
; 書き込み:
;   1. servo_gui.py とシリアルモニタを閉じる
;   2. リセットを約2秒押し、緑 LED が点いたら離す
;   3. pio run -t upload
;
; GUI:
;   pip install -r tools/requirements.txt
;   python tools/servo_gui.py

[platformio]
default_envs = servo-bench

[env:servo-bench]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; USB CDC では 921600 切替後に No serial data になりやすい
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, time
; DTR/RTS を立てると USB 接続のたびにリセットする
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
