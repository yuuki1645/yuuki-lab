; atom-rt（yuuki-lab 内）
; ATOMS3 Lite リアルタイム制御（USB のみ, 20Hz）
;
; 書き込み:
;   1. lab_debug / rt_monitor / rt_usb_log / シリアルモニタを閉じる
;   2. リセットを約2秒押し、緑LEDが点いたら離す（ダウンロードモード）
;   3. pio run -t upload
; 総合デバッグ（机上・複数 ATOM・I2C スキャン）:
;   python tools/lab_debug.py
; リアルタイムモニタ（1台・従来の 20Hz グラフ）:
;   python tools/rt_monitor.py
; USB 行ログ:
;   python tools/rt_usb_log.py
;
; Python:
;   pip install -r tools/requirements.txt
;
; ファーム既定は Lab（サーボ PWM オフ）。rt_monitor は接続時に #MODE,robot を送る。

[platformio]
default_envs = rt-usb

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; USB CDC では 921600 切替後に No serial data になりやすい
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, time
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED@^3.7.8
    https://github.com/m5stack/M5Unit-8Servo.git

; USB 専用リアルタイム制御。pahub / ina226 は src/robot のヘッダ
[env:rt-usb]
build_src_filter =
    +<*>
    -<robot/>
build_flags =
    ${env.build_flags}
    -Isrc/rt_usb
    -Isrc/robot
