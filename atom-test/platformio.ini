; ATOM S3R の画面に Hello World を出すだけの確認用。
; atom-rt / atom-rs485 の本線ではない。この環境を焼くと、その個体のファームは消える。
; 戻すときは元のディレクトリで pio run -e <環境> -t upload。
;
; 書き込み:
;   1. シリアルモニタを閉じる
;   2. リセットを約2秒押し、緑 LED が点いたら離す（ダウンロードモード）
;   3. pio run -t upload
;
; 画面は 0.85 inch / 128x128。描画は M5Unified の自動判定（GC9107 または ST7735）。

[platformio]
default_envs = hello

[env:hello]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; ATOM S3R は Flash が Quad、PSRAM が Octal。公式の memory_type。
board_build.arduino.memory_type = qio_opi
; USB CDC では 921600 切替後に No serial data になりやすい
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, time
; DTR/RTS を立てると USB 接続のたびにリセットする
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
; 0.3.0 はボード判定が変わっている。画面確認だけなので 0.2 系の最新に固定する。
; 2026-05 以降の個体は ST7735、それ以前は GC9107。どちらもこの版の自動判定で開く。
lib_deps =
    m5stack/M5Unified@^0.2.29
