; ATOM S3R の机上確認。atom-rt / atom-rs485 の本線ではない。
; どちらの環境を焼いても、その個体に入っているファームは置き換わる。
; 戻すときは元のディレクトリで pio run -e <環境> -t upload。
;
; 既定は画面の Hello World。引数なしの upload はこちらを焼く。
;   pio run -t upload
;
; LTC1480 経由の SM105BL 試験（src/rs485、画面ライブラリは使わない）:
;   pio run -e rs485 -t upload
;   pip install -r tools/requirements.txt
;   python tools/bus_gui.py
;
; 書き込み:
;   1. GUI とシリアルモニタを閉じる
;   2. リセットを約2秒押し、緑 LED が点いたら離す（ダウンロードモード）
;   3. 上の upload

[platformio]
default_envs = hello

; 両方の環境で共通。子で同じキーを書くと、そちらで置き換わる。
[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
; ATOM S3R は Flash が Quad、PSRAM が Octal。公式の memory_type。
board_build.arduino.memory_type = qio_opi
; USB CDC では 921600 切替後に No serial data になりやすい
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, time
; DTR/RTS を立てると USB 接続のたびにリセットする
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

; 画面は 0.85 inch / 128x128。描画は M5Unified の自動判定（GC9107 または ST7735）。
; src/rs485 を一緒にコンパイルすると setup が二つになるので、main.cpp だけにする。
[env:hello]
build_src_filter = +<main.cpp>
; 0.3.0 はボード判定が変わっている。画面確認だけなので 0.2 系の最新に固定する。
; 2026-05 以降の個体は ST7735、それ以前は GC9107。どちらもこの版の自動判定で開く。
lib_deps =
    m5stack/M5Unified@^0.2.29

; GPIO5 受信、GPIO6 送信、GPIO7 が LTC1480 の DE。/RE は GND。
; 詳細は src/rs485/sms_bus.hpp。
[env:rs485]
build_src_filter = +<rs485/>
