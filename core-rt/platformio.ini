; core-rt（yuuki-lab 内）
; 腰の CoreS3。両脚 10 軸を Grove I2C で 20 Hz。
; USB の番号は ../link/include/usb_frame.hpp（ver 15）。
;
; 書き込み:
;   1. link/host/lab_debug.py とシリアルモニタを閉じる
;   2. CoreS3 のリセットを長押ししてダウンロードモードにする
;   3. pio run -t upload
;
; PSRAM は使わない。校正は 64 KB の NVS（フラッシュ）に置く。

[platformio]
default_envs = core-s3

[env:core-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -I../link/include
    -I../atom-rt/src
    -I../atom-rt/src/robot
    -I../atom-rt/src/rt_usb
    -Isrc
lib_deps =
    https://github.com/m5stack/M5Unit-8Servo.git
