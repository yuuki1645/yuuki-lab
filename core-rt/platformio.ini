; core-rt（yuuki-lab 内）
; 腰の CoreS3。両脚 10 軸を Grove I2C で 20 Hz。
; USB の番号は ../link/include/usb_frame.hpp（ver 15）。
;
; 書き込み:
;   1. link/host/lab_debug.py とシリアルモニタを閉じる
;   2. CoreS3 のリセットを長押ししてダウンロードモードにする
;   3. pio run -t upload              腰の本線（ver 15）
;      pio run -e i2c-scan -t upload  Grove のアドレス表示だけ
;      pio run -e i2c-hold -t upload  0x71 CH4 を開いたままにする
;
; PSRAM は使わない。校正は 64 KB の NVS（フラッシュ）に置く。
; i2c-scan は core-s3 と同じ 0x20000 へ書く。戻すときは core-s3 を書き直す。

[platformio]
default_envs = core-s3

[env:core-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; アプリは partitions.csv の app0（0x20000）。既定の 0x10000 だと
; ブートローダが見つけられず、RTC_SW_SYS_RST で再起動を繰り返す。
board_upload.offset_address = 0x20000
; USB CDC をモニタが開くたびにリセットしない。
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -I../link/include
    -I../atom-rt/src
    -I../atom-rt/src/robot
    -I../atom-rt/src/rt_usb
    -Isrc
; src/i2c_scan と src/i2c_hold は机上用。本線に入れると setup が二つになる。
build_src_filter =
    +<*>
    -<i2c_scan/>
    -<i2c_hold/>
lib_deps =
    https://github.com/m5stack/M5Unit-8Servo.git

; Grove の全アドレスをシリアルに出す。ver 15 は話さない。
; フラッシュ配置は core-s3 を継承する（0x10000 だと起動しない）。
[env:i2c-scan]
extends = env:core-s3
build_src_filter = +<i2c_scan/>

; 0x71 の CH4 だけを開いたままにする。黄-黒の電圧を測るため。
[env:i2c-hold]
extends = env:core-s3
build_src_filter = +<i2c_hold/>
