; CoreS3 の机上ブリッジ。腰の本線（core-rt、USB ver 15）ではない。
; サブ PC の USB と、PORT.B の Grove のあいだで行を渡す。
; ATOM S3R はこの Grove の 5V で起動する。サーボの 12V は出さない。
;
; ストレートの Grove ケーブルを CoreS3 の PORT.B と ATOM の Grove へ。
;   黄 GPIO9 送信 → ATOM 黄 GPIO2 受信
;   白 GPIO8 受信 ← ATOM 白 GPIO1 送信
;   赤 = 5V、黒 = GND
; ATOM の USB は書き込みのときだけ。そのときは Grove を外す。
; 動かすときに ATOM の USB と Grove の 5V を同時につなぐと、電源がぶつかる。
;
; 相手のファームは atom-test の grove-rs485。
;
; GUI（CoreS3 の COM だけを開く。ATOM の USB は挿さない）:
;   pip install -r tools/requirements.txt
;   python tools/servo_gui.py
;
; 書き込み:
;   1. サブ PC でこの COM を開いているプログラムを閉じる
;   2. リセットを長押ししてダウンロードモードにする
;   3. pio run -t upload
; フラッシュ配置は core-rt と同じ（0x20000 / 16MB）。既定の 0x10000 だと起動しない。

[platformio]
default_envs = bridge

[env:bridge]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, time
; DTR/RTS を立てると USB 接続のたびにリセットする
monitor_rts = 0
monitor_dtr = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; アプリは partitions.csv の app0（0x20000）。
board_upload.offset_address = 0x20000
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
