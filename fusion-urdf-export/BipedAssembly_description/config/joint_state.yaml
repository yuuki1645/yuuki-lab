# Joint configuration for joint_state_publisher_gui

joint_state_publisher:
  ros__parameters:
    # Joint names and default positions
    zeros:
      left_ankle_pitch: 0.0
      left_ankle_roll: 0.0
      left_hip_pitch: 0.0
      left_hip_roll: 0.0
      left_knee_pitch: 0.0
      right_ankle_pitch: 0.0
      right_ankle_roll: 0.0
      right_hip_pitch: 0.0
      right_hip_roll: 0.0
      right_knee_pitch: 0.0

    # Joints to publish
    source_list:
      - left_ankle_pitch
      - left_ankle_roll
      - left_hip_pitch
      - left_hip_roll
      - left_knee_pitch
      - right_ankle_pitch
      - right_ankle_roll
      - right_hip_pitch
      - right_hip_roll
      - right_knee_pitch