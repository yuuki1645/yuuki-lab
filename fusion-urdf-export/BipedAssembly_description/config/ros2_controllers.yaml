# Generated ros2_control controllers
# Publishes joint states on: /joint_states
# Command topics use: /<controller_name>/commands
/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      position_controller:
        type: forward_command_controller/ForwardCommandController
      velocity_controller:
        type: forward_command_controller/ForwardCommandController

  joint_state_broadcaster:
    ros__parameters: {}

  # Command topic: /position_controller/commands
  position_controller:
    ros__parameters:
      joints: [left_ankle_pitch, left_ankle_roll, left_hip_pitch, left_hip_roll, left_knee_pitch, right_ankle_pitch, right_ankle_roll, right_hip_pitch, right_hip_roll, right_knee_pitch]
      interface_name: position

  # Command topic: /velocity_controller/commands
  velocity_controller:
    ros__parameters:
      joints: [left_ankle_pitch, left_ankle_roll, left_hip_pitch, left_hip_roll, left_knee_pitch, right_ankle_pitch, right_ankle_roll, right_hip_pitch, right_hip_roll, right_knee_pitch]
      interface_name: velocity
