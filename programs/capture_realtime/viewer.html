<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Capture Realtime</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 12px 16px;
        font-size: 14px;
        opacity: 0.85;
      }
      /* video ではなく img。MJPEG をそのまま流して低遅延表示する */
      img#live {
        display: block;
        width: 100%;
        max-height: calc(100vh - 96px);
        object-fit: contain;
        background: #000;
      }
      .hint {
        padding: 12px 16px 20px;
        font-size: 13px;
        line-height: 1.5;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <header>実機キャプチャ リアルタイム（MJPEG・巻き戻し不可）</header>
    <img id="live" alt="live capture" />
    <p class="hint">
      低遅延監視用です。過去へシークしたいときは
      <code>programs/capture_hls</code> を使ってください。映像が止まったらページを再読み込み。
    </p>
    <script>
      (function () {
        // キャッシュ回避のためクエリを付与（再接続時用）
        document.getElementById("live").src = "stream.mjpg?t=" + Date.now();
      })();
    </script>
  </body>
</html>
