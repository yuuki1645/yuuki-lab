# 等身大ロボット（現状は脚部のみ）の URDF パラメータ。
#
# 数値を変えたあとは、プロジェクトルートで次を実行する。
#   python robot_description/generate_urdf.py
#
# 生成物 robot_description/yuuki_biped.urdf は手で編集しない。
# 単位はメートル、キログラム。関節範囲だけ度（スクリプトがラジアンに変換する）。
#
# 座標系（直立・全関節 0）:
#   x 前、y 左、z 上。原点はカゴ底面の中央。
#   正のピッチ（+Y 軸、右手系）は脚を後ろへ曲げる。膝 0 が伸びた直立。
#   左脚の正のロール（+X）は脚を左（外側）へ開く。
#   右脚は right_roll_axis_sign が -1 のとき、正のロールが右（外側）へ開く。

robot_name: yuuki_biped

# ---------------------------------------------------------------------------
# 図面・仕様から採った値（docs/images/biped_lower_body_structure.jpg と docs/robot_spec.md）
# 直方体は URDF と同じくフルサイズ [x, y, z]。MuJoCo の半サイズではない。
# ---------------------------------------------------------------------------

# カゴ。仕様: 幅 28 cm、高さ 14.5 cm、奥行き 18 cm。
# ここでの並びは [前後 x, 左右 y, 上下 z]。
basket:
  size_m: [0.18, 0.28, 0.145]
  # 仮定。仕様の重量欄は「？」。カゴ本体と中の基板をまとめた仮の値。
  mass_kg: 0.6

# サーボ RDS51150。仕様: 180 g、トルク 14.7 N·m。
# 図面の取り付け向き: 脚方向 65 mm、左右 48 mm、前後 30 mm。
# 仕様表の「幅 65 / 高さ 48 / 厚さ 30」はカタログ寸法であり、この並びとは別。
# 実機を見て向きが違う場合は、この3つの数字の順番を入れ替える。
servo:
  size_m: [0.030, 0.048, 0.065]
  mass_kg: 0.180
  # 図面の書き込み「ケースから軸まで 13 mm」。軸はサーボ上端からこの距離だけ下にある、として使う。
  axis_inset_m: 0.013

# 腿・脛のアルミ板。仕様: 幅 4 cm、長さ 20 cm、厚さ 3 mm、63 g。両側に1枚。
# 並び [前後の幅, 左右の厚さ, 脚方向の長さ]。
# 側面図の 4 cm を前後、仕様の 3 mm を左右厚さ、とした読み。違う場合は並びを変える。
plate:
  size_m: [0.040, 0.003, 0.200]
  mass_kg: 0.063
  # 仮定。脚の中心から左右の板の中心までの距離。
  # 0.0295 = サーボ半幅 0.024 + 隙間 clearance_m 0.004 + 板厚の半分 0.0015。
  # 板をサーボの側面に密着させると、同じ高さの区間で面が重なって見える。
  center_y_m: 0.0295

# リポ。質量はセル（仕様 302 g）。衝突箱はセル寸法ではなく、側板のあいだのダンボール。
# セル寸法は記録だけ。並び [前後, 左右, 脚方向]。箱の大きさは generate_urdf.py が
# 上下のサーボと左右の板から、clearance_m を空けて決める。ダンボールの質量は未計測なので足さない。
battery:
  cell_size_m: [0.024, 0.040, 0.130]
  mass_kg: 0.302
  # 仕様文と写真では脛にも1本ある。図面には脛の寸法書き込みがないので、腿と同じ箱を置く。
  on_shin: true

# 足裏のアルミ板。仕様: 幅 17 cm、長さ 30 cm、厚さ 2 mm、271 g。
# 並び [前後の長さ, 左右の幅, 厚さ]。
foot:
  size_m: [0.300, 0.170, 0.002]
  mass_kg: 0.271
  # 仮定。足首ロール軸から見て、足板の幾何中心がどれだけ前にあるか。正がつま先側。
  center_x_m: 0.05
  # 足首ロール軸から足裏（板の下面）まで。
  # サーボは軸の下へ 52 mm 伸びる。板厚 2 mm と clearance_m 4 mm を足して 58 mm。
  # 以前の 40 mm では、サーボの箱が板を貫いて板の下へ 12 mm 出ていた。
  # 金具の高さを測ったら、この値をその実測に差し替える。
  ankle_to_sole_m: 0.058

# ---------------------------------------------------------------------------
# 図面に数値が無い配置。変えるときはここ。
# null にすると、下のコメントにある式で servo / plate から計算する。
# ---------------------------------------------------------------------------

placement:
  # 仮定。股ロール軸の前後位置。0 はカゴ底面の前後中央。正が前。
  hip_x_m: 0.0
  # 仮定。左右の股ロール軸までの距離（中心から）。0.09 なら両脚の間隔は 18 cm。
  # 28 cm はカゴの幅であり、脚の間隔ではない。
  hip_y_m: 0.09
  # 股の2個、足首の2個など、板を挟まずに並ぶサーボの軸間距離。
  # null なら servo.size_m の z（0.065）。軸は動かさない。箱の下端だけ clearance_m 分短くする。
  stacked_servo_distance_m: null
  # 未計測。写真ではサーボと板、サーボとダンボール、上下のサーボのあいだに金具の隙間がある。
  # その隙間の代わりに、衝突箱をこの距離だけ離す。実測したらこの1つを変えて URDF を作り直す。
  clearance_m: 0.004
  # 腿・脛の軸間距離（股ピッチ→膝、膝→足首ピッチ）。
  # null なら servo.axis_inset_m * 2 + plate の z。
  # 初期状態では 0.013 + 0.200 + 0.013 = 0.226。
  # 「軸は板側の面から 13 mm、そのあいだを板 20 cm が占める」という仮定。
  segment_axis_distance_m: null

# 仮定。正面写真でカゴ下・両脚のあいだに丸い部品が見えるが、IMU とは未確認。
# 位置はカゴ底のすぐ下、左右中央。質量は動力学にほぼ効かない印。
imu:
  xyz_m: [0.0, 0.0, -0.02]
  mass_kg: 0.0001

# 全サーボ共通。effort は仕様の 150 kg·cm = 14.7 N·m。
# velocity は仮定（無負荷速度は未計測）。
actuator:
  effort_nm: 14.7
  velocity_limit_rad_s: 8.0
  damping: 0.0
  friction: 0.0

# 機械ストッパは未計測。歩行の学習で極端な折れを避けるための仮の範囲。
# ピッチの正は後ろ方向。膝の 0 は伸び、正は屈曲。
joints_deg:
  hip_roll: [-45, 45]
  hip_pitch: [-45, 90]
  knee_pitch: [0, 120]
  ankle_pitch: [-45, 45]
  ankle_roll: [-30, 30]

# 右脚ロール軸の符号。-1 なら軸が -X を向き、正の指令が外側へ開く。
# 1 にすると左脚と同じ +X になり、正の指令は右脚を内側へ閉じる。
right_roll_axis_sign: -1
